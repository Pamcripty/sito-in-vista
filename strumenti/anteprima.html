<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Jost';
    font-style: normal;
    font-weight: 200 700;
    src: url('../src/font/jost-200-700-normal-latin.woff2') format('woff2');
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px;
    background: #F8F2E6;
    font-family: 'Jost', sans-serif;
    color: #083B3D;
    display: grid;
    grid-template-columns: 360px 1fr;
    align-items: center;
    gap: 48px;
    padding: 0 72px;
    position: relative;
    overflow: hidden;
  }
  .telaio {
    display: block;
    position: absolute;
    border: 1px solid rgba(8, 59, 61, 0.14);
  }
  .telaio--a { inset: -60px auto auto -80px; width: 420px; height: 220px; }
  .telaio--b { inset: auto -90px -70px auto; width: 520px; height: 240px; }
  .icona { width: 300px; height: 300px; justify-self: center; }
  .parola {
    display: flex; align-items: baseline; gap: 22px;
    font-size: 104px; line-height: 0.9; letter-spacing: -0.045em;
  }
  .parola b { font-weight: 700; }
  .parola span { font-weight: 200; }
  .filo { display: block; width: 88px; height: 8px; background: #F2B84B; margin: 30px 0 26px; }
  .descrittore { font-size: 32px; font-weight: 300; letter-spacing: -0.01em; color: #253238; }
  .payoff {
    margin-top: 14px;
    font-size: 44px; font-weight: 400; letter-spacing: -0.03em; color: #0F5C5E;
  }
</style>
</head>
<body>
  <span class="telaio telaio--a"></span>
  <span class="telaio telaio--b"></span>

  <svg class="icona" viewBox="0 0 1080 1080">
    <rect width="1080" height="1080" rx="240" fill="#0F5C5E"/>
    <rect x="205" y="240" width="560" height="560" rx="90" fill="#F8F2E6"/>
    <g fill="#0F5C5E">
      <circle cx="283" cy="320" r="22"/><circle cx="357" cy="320" r="22"/><circle cx="431" cy="320" r="22"/>
    </g>
    <path fill="#0F5C5E" d="M303 390h348a40 40 0 0 1 40 40v40l-60 80 60 80v40a40 40 0 0 1-40 40H303a40 40 0 0 1-40-40V430a40 40 0 0 1 40-40Z"/>
    <g fill="#F8F2E6">
      <rect x="313" y="440" width="125" height="170" rx="22"/>
      <rect x="478" y="450" width="145" height="34" rx="17"/>
      <rect x="478" y="516" width="112" height="34" rx="17"/>
      <rect x="478" y="582" width="145" height="34" rx="17"/>
    </g>
    <g stroke="#F2B84B" stroke-width="34" stroke-linecap="round">
      <path d="M818 378 893 331"/><path d="M825 520H945"/><path d="M818 662 893 709"/>
    </g>
  </svg>

  <div>
    <p class="parola"><span>Sito in</span><b>Vista</b></p>
    <span class="filo"></span>
    <p class="descrittore">Siti web per piccole attività</p>
    <p class="payoff">Quando ti cercano, ci sei.</p>
  </div>
</body>
</html>
